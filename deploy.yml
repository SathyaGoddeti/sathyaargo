---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeployment
 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mydeployment
      env: devenv
  template:
    metadata:
      labels:
        app: mydeployment
        env: devenv
    spec:
      containers:
        - name: mycontainer
          image: shaikmustafa/paytm:bus
          ports:
            - containerPort: 80

        - name: helpercontainer
          image: shaikmustafa/dm
          command:
            - /bin/sh
            - -c
            - while true; do echo welcome to sathya; sleep 10; done
---
